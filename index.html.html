<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061720">
  <meta name="description" content="Dive into an interactive museum mission about ocean plastic and UN Sustainable Development Goal 14: Life Below Water.">
  <title>The Deep Blue Rescue | Ocean Learning Lab</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <style>@font-face{font-family:Atkinson;src:url(assets/atkinson.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Atkinson;src:url(assets/atkinson-bold.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Barlow;src:url(assets/barlow-condensed.woff2) format('woff2');font-weight:800;font-display:swap}

:root{color-scheme:dark;--bg:#061720;--panel:#0b222c;--line:#2a4851;--text:#f2fbf9;--muted:#b4cbd0;--mint:#a4f3d8;--gold:#ffd48e;--ink:#09251f;--mono:'Courier New',monospace;--reading:clamp(1.2rem,3vw,2rem)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Atkinson,'Trebuchet MS',sans-serif;color:var(--text);background:radial-gradient(ellipse at 68% 3%,#102f39 0,transparent 53%),var(--bg)}
button,input,summary{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{cursor:default}
button:focus-visible,summary:focus-visible,input:focus-visible+span{outline:3px solid var(--gold);outline-offset:4px}
[hidden]{display:none!important}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
h1,h2,p{margin:0}
h1,h2{font-family:Barlow,'Arial Narrow',sans-serif;font-weight:800;line-height:.98}
.shell{width:min(92%,1280px);margin-inline:auto}
.icon,.utility svg{display:inline-block;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.site-header{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand,.utilities,.utility,.sdg-tag{display:flex;align-items:center;gap:.65rem}
.brand{gap:.78rem;line-height:1.2}
.brand strong,.brand span{display:block}
.brand strong{font-size:1.18rem}
.brand span{color:var(--muted);font-size:.9rem}
.utilities{justify-content:flex-end;flex-wrap:wrap}
.utility,.sdg-tag{border:1px solid var(--line);border-radius:8px;padding:.54rem .72rem;min-height:44px;background:#0c232e;font-size:.95rem}
.utility svg{width:18px;height:18px;color:var(--mint)}
.utility:hover,.utility[aria-pressed='true']{border-color:var(--mint);background:#153843}
.sdg-tag strong{color:var(--mint);font:700 .84rem var(--mono);white-space:nowrap}
.sdg-tag span{color:var(--muted)}
.progress{padding:0 0 18px}
.progress ol{list-style:none;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:0;padding:0;border:1px solid var(--line);border-radius:11px;background:#0a222a;overflow:hidden}
.progress li{min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 5px;color:#adbec5;font-size:1rem;font-weight:700;border-bottom:3px solid transparent;line-height:1.12}
.progress li[aria-current]{background:#133a40;color:var(--mint);border-color:var(--mint)}
.progress-number{display:grid;place-items:center;color:#b8c9cd;border:1px solid #44616b;border-radius:5px;font:700 .75rem var(--mono);width:27px;height:25px;flex:none}
.progress li[aria-current] .progress-number{color:var(--ink);background:var(--mint);border-color:var(--mint)}
.progress li.done .progress-number{color:var(--mint);border-color:#547f7b}
.progress-number .icon{width:16px;height:16px}
.site-footer{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:18px 0;color:var(--muted);font-size:.9rem}
.site-footer>span:first-child{display:flex;align-items:center;gap:.62rem;font:700 .72rem var(--mono);letter-spacing:.085em;color:#b2cdd1}
.site-footer i,.eyebrow>span,.field-label i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--mint);flex:none}

.hero{position:relative;isolation:isolate;min-height:clamp(34rem,74vh,44rem);display:flex;flex-direction:column;justify-content:center;overflow:hidden;border:1px solid #3d656c;border-radius:17px;background:#0c3340 url(assets/reef-poster.jpg) center/cover no-repeat}
.hero-video,.hero-shade,.hero-grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.hero-video{object-fit:cover;object-position:center;filter:saturate(1.38) brightness(1.1)}
.hero-shade{background:linear-gradient(90deg,#051b26 0,rgba(5,24,34,.98) 16%,rgba(5,26,37,.82) 43%,rgba(5,26,37,.25) 71%,rgba(6,27,36,.12) 100%),linear-gradient(0deg,rgba(5,23,33,.94),transparent 29%,transparent 78%,rgba(8,27,35,.56))}
.hero-grid{background:repeating-linear-gradient(0deg,transparent 0 55px,#c3ffed15 56px 57px),repeating-linear-gradient(90deg,transparent 0 55px,#c3ffed15 56px 57px);mask-image:linear-gradient(90deg,transparent 39%,#111 87%)}
.hero-main{padding:clamp(1.4rem,5vw,4.4rem) clamp(1.25rem,5.25vw,4.8rem) 5rem;animation:arrive .45s ease-out both}
.eyebrow{display:flex;align-items:center;gap:.66rem;color:var(--mint);font:700 clamp(.75rem,1.35vw,.92rem) var(--mono);letter-spacing:.13em;text-transform:uppercase}
.hero-main h1{font-size:clamp(4rem,8.7vw,8.3rem);line-height:.8;letter-spacing:.005em;margin:1.25rem 0;text-shadow:0 2px 24px #061a26aa}
.hero-main h1 em{color:var(--mint);font-style:normal}
.hero-intro{font-size:clamp(1.4rem,2.35vw,2rem);line-height:1.26;max-width:27ch;color:#e2eeef;margin-bottom:1.35rem}
.language{display:flex;gap:.64rem;flex-wrap:wrap;margin-bottom:1rem}
.language button{display:flex;gap:.52rem;align-items:center;min-height:49px;padding:.45rem .8rem;background:#0c2634;border:1px solid #65848b;border-radius:7px;font-weight:700;font-size:1.15rem}
.language button span{font:700 .75rem var(--mono);border:1px solid currentColor;border-radius:4px;padding:.18rem .25rem}
.language button[aria-pressed='true'],.language button:hover{color:var(--mint);border-color:var(--mint);background:#163b3e}
.button{display:inline-flex;align-items:center;justify-content:center;gap:.78rem;max-width:100%;min-height:54px;padding:.56rem 1.12rem;border:1px solid transparent;border-radius:8px;font-weight:700;font-size:clamp(1.1rem,2.3vw,1.5rem);line-height:1.15;text-align:center;transition:transform .2s}
.button.primary{background:var(--mint);color:var(--ink)}
.button.primary:hover:not(:disabled){background:#d4ffef;transform:translateY(-2px)}
.button.primary:disabled{background:#1b3740;border-color:#36535b;color:#b8ced1}
.button.secondary{background:#122d36;border-color:#51727c}
.button.secondary:hover{background:#1b444a}
.hero-main>.button{min-height:62px;padding:.7rem 1.35rem;animation:signal 2.2s ease-in-out .4s 2}
.field-label{position:absolute;top:24px;right:24px;display:grid;gap:.33rem;min-width:170px;padding:.73rem .88rem;background:#071f29e8;border-top:1px solid var(--mint);border-bottom:1px solid #86c2bd72;border-radius:2px;color:var(--mint);font:700 .7rem var(--mono);letter-spacing:.11em}
.field-label span{display:flex;align-items:center;gap:.58rem}
.field-label strong{color:#f2fbf9;font-size:.79rem}
.hero-footer{position:absolute;inset:auto 0 0;min-height:57px;padding:.3rem 1.3rem;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#071d29e8;border-top:1px solid #a2f6df40;color:#c6e5e1;font:700 .75rem var(--mono);letter-spacing:.11em}
.hero-footer>span{display:flex;align-items:center;flex-wrap:wrap;gap:.6rem 1rem}
.hero-footer b{width:4px;height:4px;background:#94dacc;border-radius:50%}
.motion-control{display:grid;place-items:center;width:44px;height:44px;flex:none;border:1px solid #577980;border-radius:6px;background:#102e39;color:var(--mint)}
.motion-control:hover{background:#1b444a}
.motion-control .icon{width:20px;height:20px}

.stage{min-height:32rem;padding:clamp(1.2rem,3.6vw,3rem);border:1px solid var(--line);border-radius:17px;background:radial-gradient(ellipse at top right,#143741,transparent 60%),var(--panel);animation:arrive .28s ease-out both}
.stage-heading{display:flex;gap:1rem;align-items:end;justify-content:space-between;margin-bottom:1.45rem}
.stage-heading h1,.award h1{font-size:clamp(2.9rem,6.5vw,5.25rem);margin:.5rem 0 .65rem;color:var(--text)}
.stage-intro,.award p,.survey>p,dialog>p{font-size:var(--reading);line-height:1.25;color:var(--muted);max-width:49ch}
.stage-actions{margin-top:1.25rem;display:flex;align-items:center;gap:1rem;justify-content:space-between}
.stage-actions p{color:var(--muted);font-size:1.13rem;line-height:1.35;max-width:58ch}
.stage-actions>.button:last-child:not(.secondary){margin-inline-start:auto;flex-shrink:0}
.tally,.role-pill{display:inline-flex;align-items:center;gap:.58rem;flex:none;color:var(--mint);border:1px solid #558784;background:#0b2e36;border-radius:8px;padding:.55rem .72rem;font-size:1.1rem;font-weight:700}
.tally strong{font:700 1.1rem var(--mono);padding:.22rem .4rem;background:var(--mint);color:var(--ink);border-radius:4px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.role-card{display:flex;flex-direction:column;align-items:stretch;gap:1rem;text-align:left;padding:clamp(1rem,2.6vw,2rem);border:1px solid #506e78;border-radius:10px;background:linear-gradient(142deg,#153842,#0b2633 77%);transition:transform .18s,border-color .18s}
.role-card:hover{border-color:var(--mint);transform:translateY(-4px)}
.role-card:nth-child(2){background:linear-gradient(142deg,#215358,#0c2d39 77%);border-color:#77b8ae}
.role-card:nth-child(3){background:linear-gradient(142deg,#2c3f55,#142833 77%)}
.role-top{display:flex;align-items:center;gap:.7rem;justify-content:space-between;flex-wrap:wrap}
.role-icon,.award-icon{display:grid;place-items:center;width:58px;height:58px;border-radius:8px;border:1px solid #71ab9f;background:#17434a;color:var(--mint)}
.role-icon svg{width:33px;height:33px}
.role-card strong,.dive-log h2,.quiz-panel h2,.survey h2,dialog h2{font-family:Barlow,'Arial Narrow',sans-serif;font-weight:800;font-size:clamp(2.1rem,4vw,3rem);line-height:.98}
.role-description{font-size:clamp(1.25rem,2vw,1.65rem);color:var(--muted);line-height:1.25}
.role-cta{display:flex;align-items:center;justify-content:space-between;gap:1rem;border-top:1px solid var(--line);padding-top:.8rem;margin-top:auto;color:var(--mint);font-weight:700;font-size:1.3rem}
.briefing-video{display:block;width:min(100%,870px);height:auto;aspect-ratio:16/9;margin-inline:auto;border:1px solid #62858b;border-radius:9px;background:#081920}
.transcript{margin:1rem auto 0;width:min(100%,870px);border:1px solid var(--line);border-radius:9px;background:#112d37}
.transcript summary{padding:.68rem 1rem;cursor:pointer;min-height:50px;font-size:1.3rem;font-weight:700;color:var(--mint)}
.transcript>div{padding:0 1rem 1rem;color:var(--muted);font-size:var(--reading);line-height:1.3}
.transcript p{margin:.65rem 0}
.transcript p:first-child{color:var(--mint)}

.explore-layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:1rem}
.reef-map{position:relative;aspect-ratio:2/1;background:#173440 url(assets/reef-map.svg) center/100% 100%;border:1px solid #527780;border-radius:10px;min-height:240px}
.marker{position:absolute;transform:translate(-50%,-50%);width:49px;height:49px;display:grid;place-items:center;border:2px solid #0d2c35;border-radius:50%;background:var(--gold);color:#282016;font-size:1.38rem;font-weight:700;box-shadow:0 0 0 3px #ffd48e67;animation:signal 2.2s ease-out .4s 2}
.marker:nth-child(1){left:22%;top:35%}.marker:nth-child(2){left:75%;top:29%}.marker:nth-child(3){left:42%;top:68%}.marker:nth-child(4){left:83%;top:73%}
.marker.visited,.marker[aria-pressed='true']{background:var(--mint);box-shadow:0 0 0 3px #a4f3d86b;animation:none}
.marker:hover{background:#fff7e7}
.marker span,.clue-item span{display:grid;place-items:center}
.clue-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.53rem;margin-top:.62rem}
.clue-item{display:flex;align-items:center;gap:.65rem;min-height:54px;padding:.35rem .58rem;border:1px solid #4a6b75;border-radius:7px;background:#142e38;text-align:left;font-size:clamp(1.05rem,1.8vw,1.25rem);line-height:1.13}
.clue-item span{width:30px;height:30px;flex:none;border:1px solid #6d7778;border-radius:4px;color:var(--gold);font-weight:700}
.clue-item.visited span{color:var(--mint);border-color:#578984}
.clue-item[aria-pressed='true'],.clue-item:hover{border-color:var(--mint);background:#184049}
.dive-log{padding:clamp(1rem,2.5vw,1.5rem);border:1px solid #557981;border-top:3px solid var(--mint);border-radius:9px;background:#102d37}
.dive-log h2{margin:.7rem 0}
.dive-log p:not(.eyebrow){font-size:clamp(1.3rem,2.65vw,2rem);line-height:1.2;color:var(--muted)}
.dive-log .timeline{margin-top:.85rem;border-top:1px solid var(--line);padding-top:.8rem}
.timeline strong{color:var(--mint)}

.sorting-board{position:relative;isolation:isolate;overflow:hidden;display:grid;align-items:center;min-height:250px;padding:1rem;border:1px solid #6b8289;border-radius:10px;background:#162f39}
.sorting-scene{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#0a242c9c,#10232f39),url(assets/reef-life.jpg) center 64%/cover;filter:grayscale(1) brightness(.79);transition:filter .6s}
.restored .sorting-scene{filter:saturate(1.3) brightness(1.13)}
.sorting-items,.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem}
.debris,.bin{display:flex;align-items:center;gap:.7rem;min-height:65px;text-align:left;font-weight:700;font-size:clamp(1.15rem,2.05vw,1.55rem);line-height:1.1;padding:.6rem .8rem}
.debris{border:2px solid #c1dcd9;border-radius:8px;background:#e9f6ef;color:#163739;cursor:grab}
.debris:active{cursor:grabbing}
.debris[aria-pressed='true'],.debris:not(:disabled):hover{background:#fff0c8;border-color:#b6802c;color:#2d281d}
.debris:disabled{background:#153438e8;border-style:dashed;border-color:#86b8ab;color:#cbefdf;cursor:default}
.debris small,.bin small{display:block;font-size:.94rem;font-weight:400;margin-top:.26rem}
.bins{margin-top:.8rem}
.bin{min-height:75px;border:1px dashed #87c4bd;border-radius:8px;background:#14363b;color:var(--mint)}
.bin:hover:not(:disabled),.bin.drop-target{background:#a5f3d9;color:var(--ink);border-style:solid}
.bin:disabled{color:#b2c8cc;border-color:#628089}
.feedback{margin:.9rem 0 0;min-height:1.4em;color:var(--muted);font-size:clamp(1.1rem,2vw,1.45rem);line-height:1.25}
.feedback.success,.feedback.mistake{padding:.55rem .68rem;border-left:3px solid currentColor;background:#102a34;border-radius:4px}.feedback.success{color:var(--mint)}.feedback.mistake{color:var(--gold)}

.quiz-panel,.survey{padding:clamp(1rem,3vw,2rem);border:1px solid #527984;border-radius:11px;background:#102c38}
.quiz-panel{width:min(100%,880px);margin-inline:auto}
.quiz-panel.cleared{border-color:var(--mint);background:radial-gradient(ellipse at 100% 0%,#215852,transparent 70%),#102c38;animation:signal .55s ease-out}
.quiz-panel h2,.survey h2,dialog h2{margin-bottom:.85rem}
.options{display:grid;gap:.65rem}
.options button{display:flex;align-items:center;gap:.7rem;text-align:left;min-height:54px;padding:.54rem .72rem;border:1px solid #7da1a7;border-radius:7px;background:#153c45;color:#f2fbf9;font-size:clamp(1.2rem,2.7vw,2rem);font-weight:700;line-height:1.18}
.options button:hover:not(:disabled){background:#22545b;border-color:var(--mint)}
.options button.right{border-color:var(--mint);color:var(--mint)}
.options button.wrong{border-color:var(--gold);color:var(--gold)}
.option-letter{display:grid;place-items:center;flex:none;width:35px;height:35px;border:1px solid currentColor;border-radius:4px;color:inherit;font:700 1rem var(--mono)}
.award-layout{display:grid;grid-template-columns:1fr 1.1fr;gap:1.25rem}
.award{padding:clamp(1rem,3vw,2rem);border:1px solid #609985;border-radius:11px;background:radial-gradient(ellipse at 0% 0%,#1f554d,#0d303a 68%)}
.award .award-icon{width:80px;height:80px;margin-bottom:1rem}
.award-icon svg{width:48px;height:48px}
.award p.eyebrow{font:700 .84rem var(--mono);color:var(--mint)}
.award .tally{margin-top:1rem}
.survey fieldset{border:0;padding:0;margin:1.1rem 0;min-width:0}
.survey legend{font-size:clamp(1.25rem,2.8vw,1.8rem);font-weight:700;padding:0 0 .55rem}
.survey fieldset div{display:flex;gap:.55rem;flex-wrap:wrap}
.survey label{position:relative;cursor:pointer}
.survey input{position:absolute;opacity:0;width:1px;height:1px}
.survey label span{display:grid;place-items:center;min-width:44px;min-height:45px;border:1px solid #7fa3a8;border-radius:6px;background:#173c47;padding:.45rem .7rem;font-size:1.1rem;font-weight:700}
.survey input:checked+span{background:var(--mint);color:var(--ink)}
dialog{background:#102d38;color:var(--text);width:min(92%,580px);border:1px solid #71b2a8;border-radius:12px;padding:1.4rem;max-height:90vh}
dialog::backdrop{background:#061720d9}
dialog>.button{margin-top:.65rem}

@keyframes arrive{from{opacity:.55;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes signal{0%,60%,100%{box-shadow:0 0 0 0 #a4f3d800}29%{box-shadow:0 0 0 6px #a4f3d856}}
@media(min-width:1100px){
  .hero-intro,.role-description,.dive-log p:not(.eyebrow),.options button,.survey legend{font-size:2rem}
}
@media(max-width:800px){
  .stage-heading{align-items:start;flex-wrap:wrap;gap:.6rem}
  .progress li{font-size:.82rem}
  .explore-layout,.award-layout{grid-template-columns:1fr}
  .stage-actions{flex-wrap:wrap}
  .field-label{right:15px;top:15px;min-width:0}
}
@media(max-width:580px){
  .shell{width:94%}
  .site-header{min-height:71px;gap:.38rem}
  .brand{gap:.44rem}
  .brand img{width:36px;height:36px}
  .brand strong{font-size:1rem}
  .brand span,.sdg-tag{display:none}
  .utilities{gap:.32rem}
  .utility{padding:.42rem .5rem;font-size:.8rem;gap:.27rem}
  .utility svg{width:15px;height:15px}
  .progress{padding-bottom:11px}
  .progress ol{gap:0}
  .progress li{flex-direction:column;gap:4px;font-size:.69rem;text-align:center;padding:6px 2px}
  .progress-number{width:23px;height:21px}
  .hero{min-height:36rem}
  .hero-main{padding:4rem 1.05rem 5rem}
  .hero-main h1{font-size:clamp(3rem,11.9vw,5rem)}
  .hero-intro{font-size:1.42rem}
  .hero-shade{background:linear-gradient(90deg,#061b26ee,#0a263698 82%),linear-gradient(0deg,#071d29,transparent 75%)}
  .hero-footer{padding:.3rem .75rem;font-size:.61rem;letter-spacing:.065em}
  .hero-footer>span{gap:.4rem .52rem}
  .field-label{top:13px;right:13px;padding:.45rem;font-size:.58rem}
  .field-label strong{font-size:.63rem}
  .roles{grid-template-columns:1fr}
  .role-card{gap:.65rem}
  .sorting-items{grid-template-columns:repeat(2,minmax(0,1fr));gap:.46rem}
  .sorting-board{padding:.55rem}
  .debris,.bin{padding:.48rem;gap:.4rem}
  .bin{flex-direction:column;align-items:flex-start;font-size:1rem}
  .bins{gap:.42rem}
  .site-footer>span:last-child{display:none}
  .reef-map{min-height:200px}
  .marker{width:44px;height:44px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.stage-intro{background:#fef3c7!important;color:#0b2545!important;border-left:5px solid #d90429!important;padding:12px 16px!important;border-radius:8px!important;font-weight:700!important;margin-top:12px!important;display:inline-block!important;}</style>
  
</head>
<body><div hidden=""><svg xmlns="http://www.w3.org/2000/svg">
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"></path></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"></path></symbol>
  <symbol id="play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7z"></path></symbol>

const escape = value => value.replaceAll('&', '&amp;').replaceAll('"', '&quot;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
const action = (label, name, options = {}) => `<button type="button" class="button ${options.secondary ? 'secondary' : 'primary'}" data-action="${name}" ${options.disabled ? 'disabled' : ''}>${label}${options.secondary ? '' : icon('arrow')}</button>`;
const heading = (title, intro, badge = '') => `<header class="stage-heading"><div><p class="eyebrow"><span></span>${number(state.step)} / ${text().steps[state.step]}</p><h1 tabindex="-1">${title}</h1>${intro ? `<p class="stage-intro">${intro}</p>` : ''}</div>${badge}</header>`;
const tally = (count, total, label) => `<span class="tally"><strong>${count}/${total}</strong> ${label}</span>`;

function updateChrome() {
  const words = text();
  document.documentElement.lang = state.locale;
  document.title = `${words.title.join(' ')} | ${words.brand}`;
  for (const [id, value] of Object.entries({ brand: words.brand, 'brand-sub': words.brandSub, 'goal-code': state.locale === 'es' ? 'ODS 14' : 'SDG 14', sdg: words.sdg, 'audio-label': state.sound ? words.audioOn : words.audioOff, 'reset-label': words.reset, 'footer-name': words.footer, 'footer-note': words.footerNote })) {
    document.getElementById(id).textContent = value;
  }
  soundButton.setAttribute('aria-pressed', state.sound);
  resetButton.hidden = state.step === 0;
  progress.setAttribute('aria-label', words.nav);
  progress.innerHTML = `<ol>${words.steps.map((step, index) => `<li class="${index < state.step ? 'done' : ''}" ${index === state.step ? 'aria-current="step"' : ''}><span class="progress-number">${index < state.step ? icon('check') : number(index)}</span><span>${step}</span></li>`).join('')}</ol>`;
}

function welcome() {
  const words = text();
  return `<section class="hero" aria-labelledby="hero-title">
    <video class="hero-video" src="https://6b048ba3b10968d10f41c37d--deep-blue-rescue.netlify.app/assets/reef-loop.mp4" poster="https://6b048ba3b10968d10f41c37d--deep-blue-rescue.netlify.app/assets/reef-poster.jpg" muted loop playsinline preload="none" aria-hidden="true"></video>
    <div class="hero-shade"></div><div class="hero-grid"></div>
    <div class="hero-main"><p class="eyebrow"><span></span>${words.exhibit}</p><h1 id="hero-title" tabindex="-1">${words.title[0]}<br><em>${words.title[1]}</em></h1>
      <p class="hero-intro">${words.intro}</p>
      <div class="language" role="group" aria-label="${words.language}"><button type="button" lang="en" data-language="en" aria-pressed="${state.locale === 'en'}"><span>EN</span> English</button><button type="button" lang="es" data-language="es" aria-pressed="${state.locale === 'es'}"><span>ES</span> Español</button></div>
      ${action(words.start, 'start')}
    </div>
    <div class="field-label" aria-hidden="true"><span><i></i>${words.field} / 01</span><strong>${words.live}</strong></div>
    <div class="hero-footer"><span>${words.mission}<b></b>${words.target}<b></b>${words.format}</span><button type="button" class="motion-control" data-action="motion" aria-label="${words.pause}">${icon('pause')}</button></div>
  </section>`;
}

function roleSelection() {
  const words = text();
  return `<section class="stage">${heading(words.roleTitle, words.roleIntro)}<div class="roles">${roles[state.locale].map(([name, level, description], index) =>
    `<button type="button" class="role-card" data-role="${index}"><span class="role-top"><span class="role-icon">${icon(roleIcons[index])}</span><span class="eyebrow">${level}</span></span><strong>${name}</strong><span class="role-description">${description}</span><span class="role-cta">${words.roleSelect} ${icon('arrow')}</span></button>`).join('')}</div><div class="stage-actions">${action(words.back, 'welcome', { secondary: true })}</div></section>`;
}

function movie() {
  const words = text();
  return `<section class="stage">${heading(words.briefingTitle, role()[3], `<span class="role-pill">${icon(roleIcons[state.role])}${role()[0]}</span>`)}
    <video class="briefing-video" controls playsinline preload="metadata" poster="https://6b048ba3b10968d10f41c37d--deep-blue-rescue.netlify.app/assets/reef-poster.jpg" src="https://6b048ba3b10968d10f41c37d--deep-blue-rescue.netlify.app/assets/briefing-${state.locale}.mp4" aria-label="${words.briefingMovie}"></video>
    <details class="transcript"><summary>${words.transcript}</summary><div><p>${words.transcriptNote}</p>${briefing[state.locale].map(lines => `<p>${lines.join(' ')}</p>`).join('')}${action(words.readDone, 'read')}</div></details>
    <div class="stage-actions"><p id="briefing-status" role="status">${state.briefingDone ? '' : words.briefingLock}</p>${action(words.enter, 'enter', { disabled: !state.briefingDone })}</div>
  </section>`;
}

function reef() {
  const words = text();
  const active = state.activeClue;
  const data = clues[state.locale];
  const clue = active === null ? null : data[active];
  const buttons = kind => data.map(([name], index) => `<button type="button" class="${kind} ${state.opened.has(index) ? 'visited' : ''}" data-clue="${index}" aria-pressed="${active === index}" aria-controls="dive-log" aria-label="${words.marker} ${index + 1}: ${escape(name)}${state.opened.has(index) ? ` (${words.explored})` : ''}"><span>${state.opened.has(index) ? icon('check') : index + 1}</span>${kind === 'clue-item' ? name : ''}</button>`).join('');
  return `<section class="stage">${heading(words.exploreTitle, words.exploreIntro, tally(state.opened.size, 4, words.explored))}
    <div class="explore-layout"><div><div class="reef-map" role="group" aria-label="${words.map}">${buttons('marker')}</div><div class="clue-list">${buttons('clue-item')}</div></div>
    <article class="dive-log" id="dive-log" aria-live="polite" aria-atomic="true"><p class="eyebrow"><span></span>${words.log}${clue ? ` / ${number(active)}` : ''}</p><h2>${clue ? clue[0] : words.logStart}</h2>${clue ? `<p>${clue[2][state.role]}</p><p class="timeline"><strong>${words.timeline}:</strong> ${clue[1]}</p>` : `<p>${words.logIntro}</p>`}</article></div>
    <div class="stage-actions"><p>${words.timeNote}</p>${action(words.cleanup, 'cleanup', { disabled: state.opened.size !== 4 })}</div>
  </section>`;
}

function cleanup() {
  const words = text();
  const [prompt, options] = preparation[state.locale];
  return `<section class="stage">${heading(words.cleanupTitle, words.cleanupIntro, tally(state.sorted.size, 6, words.pieces))}
    <div class="sorting-board ${state.sorted.size === 6 ? 'restored' : ''}"><div class="sorting-scene"></div>
      <div class="sorting-items" role="group" aria-label="${words.sortItems}">${itemOrder.map(index => {
        const name = debris[state.locale][index][0];
        const sorted = state.sorted.has(index);
        return `<button type="button" class="debris" data-item="${index}" aria-pressed="${state.selected === index}" draggable="${!sorted}" ${sorted ? 'disabled' : ''}>${icon(sorted ? 'check' : itemIcons[index])}<span>${name}${sorted ? `<small>${words.sorted}</small>` : ''}</span></button>`;
      }).join('')}</div>
    </div>
    <div class="bins" role="group" aria-label="${words.destinations}">${words.bins.map((label, index) => `<button type="button" class="bin" data-bin="${index}" ${state.sorted.size === 6 ? 'disabled' : ''}>${icon(binIcons[index])}<span>${label}${state.role === 0 ? `<small>${words.binClues[index]}</small>` : ''}</span></button>`).join('')}</div>
    <p id="sort-feedback" class="feedback ${state.sortStatus}" role="status">${state.sortMessage}</p>
    <div class="stage-actions"><p>${words.rules}</p>${action(words.debrief, 'debrief', { disabled: state.sorted.size !== 6 })}</div>
    <dialog id="bottle-dialog" aria-labelledby="bottle-heading"><h2 id="bottle-heading">${prompt}</h2><div class="options">${options.map((option, index) => `<button type="button" data-prepare="${index}">${option}</button>`).join('')}</div><p class="feedback" id="prep-feedback" role="status"></p>${action(words.back, 'close-bottle', { secondary: true })}</dialog>
  </section>`;
}

function debrief() {
  const words = text();
  const [prompt, options, correct] = quiz();
  return `<section class="stage">${heading(words.debrief, words.quizIntro, tally(state.question + 1, 3, words.question))}
    <article class="quiz-panel"><h2 id="question" tabindex="-1">${prompt}</h2><div class="options" aria-labelledby="question" role="group">${options.map((option, index) => `<button type="button" data-answer="${index}" ${state.passed || state.tried.has(index) ? 'disabled' : ''}><span class="option-letter">${state.passed && index === correct ? icon('check') : String.fromCharCode(65 + index)}</span>${option}</button>`).join('')}</div><p class="feedback" id="quiz-feedback" role="status"></p></article>
    <div class="stage-actions end">${action(state.question === 2 ? words.certificate : words.next, 'next', { disabled: !state.passed })}</div>
  </section>`;
}

function award() {
  const words = text();
  return `<section class="stage"><div class="award-layout"><header class="award"><span class="award-icon">${icon('badge')}</span><p class="eyebrow"><span></span>${words.debrief}</p><h1 tabindex="-1">${words.badge}</h1><p>${words.congrats}</p>${tally(state.firstTry, 3, words.firstTry)}</header>
    <article class="survey"><h2>${words.survey}</h2><p>${words.surveyNote}</p>${words.surveys.map((question, index) => `<fieldset><legend>${question}</legend><div>${words.surveyOptions.map((answer, option) => `<label><input type="radio" name="survey-${index}" value="${option}" data-survey="${index}" ${state.survey[index] === option ? 'checked' : ''}><span>${answer}</span></label>`).join('')}</div></fieldset>`).join('')}${action(words.exit, 'restart')}</article></div></section>`;
}

function speak(message) {
  if (!state.sound || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const voice = new SpeechSynthesisUtterance(message);
  voice.lang = state.locale === 'es' ? 'es-ES' : 'en-US';
  window.speechSynthesis.speak(voice);
}

function cue(success) {
  if (!state.sound || !window.AudioContext) return;
  audioContext ??= new AudioContext();
  audioContext.resume().catch(() => {});
  const tone = audioContext.createOscillator();
  const volume = audioContext.createGain();
  const time = audioContext.currentTime;
  tone.type = 'sine';
  tone.frequency.setValueAtTime(success ? 523 : 220, time);
  tone.frequency.setValueAtTime(success ? 784 : 175, time + 0.09);
  volume.gain.setValueAtTime(0.07, time);
  volume.gain.exponentialRampToValueAtTime(0.001, time + 0.27);
  tone.connect(volume).connect(audioContext.destination);
  tone.start(time);
  tone.stop(time + 0.28);
}

function syncMedia() {
  const heroVideo = station.querySelector('.hero-video');
  if (heroVideo) {
    const button = station.querySelector('[data-action="motion"]');
    const paused = state.motionPaused;
    button.setAttribute('aria-label', paused ? text().play : text().pause);
    button.innerHTML = icon(paused ? 'play' : 'pause');
    if (paused) heroVideo.pause();
    else heroVideo.play().catch(() => {
      if (heroVideo.isConnected && !state.motionPaused) {
        state.motionPaused = true;
        syncMedia();
      }
    });
  }
  if (state.step === 0 && state.sound) ambience.play().catch(() => {});
  else {
    ambience.pause();
    ambience.currentTime = 0;
  }
}

function finishBriefing() {
  state.briefingDone = true;
  station.querySelector('[data-action="enter"]').disabled = false;
  station.querySelector('#briefing-status').textContent = '';
}

function render(focus, chrome = true) {
  if (chrome) updateChrome();
  const screens = [welcome, roleSelection, movie, reef, cleanup, state.complete ? award : debrief];
  station.querySelectorAll('video').forEach(video => video.pause());
  station.innerHTML = screens[state.step]();
  syncMedia();
  if (state.step === 2) {
    const player = station.querySelector('video');
    player.muted = !state.sound;
    player.addEventListener('ended', finishBriefing, { once: true });
    player.addEventListener('error', () => {
      if (player.isConnected) station.querySelector('#briefing-status').textContent = text().movieError;
    }, { once: true });
    if (!motion.matches) player.play().catch(() => {});
  }
  if (focus) station.querySelector(focus)?.focus({ preventScroll: true });
}

function go(step) {
  window.speechSynthesis?.cancel();
  announcer.textContent = '';
  state.step = step;
  render('h1');
  window.scrollTo(0, 0);
  if (step === 1) speak(text().roleIntro);
  if (step === 5) speak(quiz()[0]);
}

function restart() {
  state = newSession();
  go(0);
}

function sort(index, bin) {
  const words = text();
  const feedback = station.querySelector('#sort-feedback');
  if (index === null) {
    feedback.textContent = words.chooseItem;
    return;
  }
  if (!Number.isInteger(index) || index < 0 || index >= answers.length || state.sorted.has(index)) return;
  if (answers[index] !== bin) {
    state.selected = index;
    updateSelection();
    state.sortStatus = 'mistake';
    state.sortMessage = `${words.wrongSort} ${debris[state.locale][index][1]}`;
    feedback.className = 'feedback mistake';
    feedback.textContent = state.sortMessage;
    cue(false);
    speak(state.sortMessage);
    return;
  }
  if (state.role === 2 && index === 0 && !state.bottlePrepared) {
    state.selected = index;
    updateSelection();
    station.querySelector('#bottle-dialog').showModal();
    speak(preparation[state.locale][0]);
    return;
  }
  state.sorted.add(index);
  state.selected = null;
  state.sortStatus = 'success';
  const finished = state.sorted.size === 6;
  state.sortMessage = finished ? `${words.restored} ${words.restoredNote}` : `${words.correctSort} ${debris[state.locale][index][1]}`;
  const nextItem = itemOrder.find(item => !state.sorted.has(item));
  render(finished ? '[data-action="debrief"]' : `[data-item="${nextItem}"]`, false);
  announcer.textContent = state.sortMessage;
  station.querySelector('[data-item]:focus, [data-action="debrief"]:focus')?.scrollIntoView({ block: 'nearest' });
  cue(true);
  speak(state.sortMessage);
}

function updateSelection() {
  station.querySelectorAll('[data-item]').forEach(button => button.setAttribute('aria-pressed', Number(button.dataset.item) === state.selected));
}

function checkAnswer(index) {
  if (state.passed || state.tried.has(index)) return;
  const words = text();
  const [, , correct, reason] = quiz();
  const right = index === correct;
  if (right && !state.tried.size) state.firstTry += 1;
  state.tried.add(index);
  state.passed = right;
  if (right) station.querySelector('.quiz-panel').classList.add('cleared');
  const options = [...station.querySelectorAll('[data-answer]')];
  options[index].classList.add(right ? 'right' : 'wrong');
  options[index].querySelector('.option-letter').innerHTML = right ? icon('check') : '×';
  options.forEach((button, option) => { button.disabled = right || state.tried.has(option); });
  const feedback = station.querySelector('#quiz-feedback');
  feedback.className = `feedback ${right ? 'success' : 'mistake'}`;
  feedback.textContent = `${right ? words.right : words.retry} ${reason}`;
  const next = station.querySelector('[data-action="next"]');
  next.disabled = !right;
  (right ? next : options.find(button => !button.disabled))?.focus();
  cue(right);
  speak(feedback.textContent);
}

station.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button || button.disabled) return;
  const data = button.dataset;
  if (data.language) {
    if (state.locale === data.language) return;
    state.locale = data.language;
    render(`[data-language="${data.language}"]`);
  } else if (data.role !== undefined) {
    state.role = Number(data.role);
    go(2);
  } else if (data.clue !== undefined) {
    const index = Number(data.clue);
    const [name, timeline, impact] = clues[state.locale][index];
    state.opened.add(index);
    state.activeClue = index;
    const updated = document.createElement('template');
    updated.innerHTML = reef();
    for (const selector of ['.tally', '.dive-log', '.stage-actions']) {
      station.querySelector(selector).innerHTML = updated.content.querySelector(selector).innerHTML;
    }
    station.querySelectorAll('[data-clue]').forEach((marker, order) => {
      const next = updated.content.querySelectorAll('[data-clue]')[order];
      marker.className = next.className;
      marker.setAttribute('aria-pressed', next.getAttribute('aria-pressed'));
      marker.setAttribute('aria-label', next.getAttribute('aria-label'));
      marker.innerHTML = next.innerHTML;
    });
    speak(`${name}. ${timeline} ${impact[state.role]}`);
  } else if (data.item !== undefined) {
    const index = Number(data.item);
    state.selected = state.selected === index ? null : index;
    updateSelection();
    state.sortMessage = state.selected === null ? text().chooseItem : `${text().selected}: ${debris[state.locale][index][0]}`;
    const feedback = station.querySelector('#sort-feedback');
    feedback.className = 'feedback';
    feedback.textContent = state.sortMessage;
  } else if (data.bin !== undefined) {
    sort(state.selected, Number(data.bin));
  } else if (data.prepare !== undefined) {
    if (Number(data.prepare) === 1) {
      state.bottlePrepared = true;
      station.querySelector('#bottle-dialog').close();
      sort(0, 0);
    } else {
      station.querySelector('#prep-feedback').textContent = `${text().wrongSort} ${preparation[state.locale][2]}`;
      cue(false);
      speak(preparation[state.locale][2]);
    }
  } else if (data.answer !== undefined) {
    checkAnswer(Number(data.answer));
  } else {
    switch (data.action) {
      case 'motion': state.motionPaused = !state.motionPaused; syncMedia(); break;
      case 'welcome': go(0); break;
      case 'start': go(1); break;
      case 'read': finishBriefing(); station.querySelector('[data-action="enter"]').focus(); break;
      case 'enter': if (state.briefingDone) go(3); break;
      case 'cleanup': if (state.opened.size === 4) go(4); break;
      case 'close-bottle': station.querySelector('#bottle-dialog').close(); break;
      case 'debrief': if (state.sorted.size === 6) go(5); break;
      case 'next':
        if (!state.passed) break;
        if (state.question === 2) {
          state.complete = true;
          render('h1', false);
          window.scrollTo(0, 0);
          speak(`${text().badge}. ${text().congrats}`);
        } else {
          state.question += 1;
          state.tried = new Set();
          state.passed = false;
          render('#question', false);
          window.scrollTo(0, 0);
          speak(quiz()[0]);
        }
        break;
      case 'restart': restart(); break;
    }
  }
});

station.addEventListener('change', event => {
  if (event.target.matches('[data-survey]')) state.survey[Number(event.target.dataset.survey)] = Number(event.target.value);
});

station.addEventListener('dragstart', event => {
  const item = event.target.closest('[data-item]');
  if (!item || item.disabled) return;
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('application/x-deep-blue', item.dataset.item);
  state.selected = Number(item.dataset.item);
  updateSelection();
});

station.addEventListener('dragover', event => {
  const bin = event.target.closest('[data-bin]');
  if (!bin || !event.dataTransfer.types.includes('application/x-deep-blue')) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  bin.classList.add('drop-target');
});

station.addEventListener('dragleave', event => {
  const bin = event.target.closest('[data-bin]');
  if (bin && !bin.contains(event.relatedTarget)) bin.classList.remove('drop-target');
});

station.addEventListener('dragend', () => station.querySelectorAll('.drop-target').forEach(bin => bin.classList.remove('drop-target')));

station.addEventListener('drop', event => {
  const bin = event.target.closest('[data-bin]');
  if (!bin || !event.dataTransfer.types.includes('application/x-deep-blue')) return;
  event.preventDefault();
  bin.classList.remove('drop-target');
  sort(Number(event.dataTransfer.getData('application/x-deep-blue')), Number(bin.dataset.bin));
});

soundButton.addEventListener('click', () => {
  state.sound = !state.sound;
  if (!state.sound) window.speechSynthesis?.cancel();
  const player = station.querySelector('.briefing-video');
  if (player) player.muted = !state.sound;
  updateChrome();
  syncMedia();
  if (state.sound && state.step === 1) speak(text().roleIntro);
  if (state.sound && state.step === 5) speak(state.complete ? text().congrats : quiz()[0]);
});

resetButton.addEventListener('click', () => {
  const words = text();
  const dialog = document.createElement('dialog');
  dialog.setAttribute('aria-labelledby', 'reset-heading');
  dialog.innerHTML = `<h2 id="reset-heading">${words.resetTitle}</h2><p>${words.resetNote}</p><form class="stage-actions" method="dialog"><button class="button secondary" value="cancel" autofocus>${words.cancel}</button><button class="button primary" value="reset">${words.resetConfirm}</button></form>`;
  dialog.addEventListener('close', () => {
    dialog.remove();
    if (dialog.returnValue === 'reset') restart();
  }, { once: true });
  document.body.append(dialog);
  dialog.showModal();
});

motion.addEventListener('change', event => {
  state.motionPaused = event.matches;
  syncMedia();
});

render();
</script></body></html>
